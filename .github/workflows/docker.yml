name: Docker

on:
  release:
    types: [published]
  # Build on relevant pull requests and pushes to main as a Dockerfile smoke
  # test (no push to registry).
  pull_request:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.github/workflows/docker.yml'
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.github/workflows/docker.yml'
  # Manual trigger — emergency rebuild path. Normal releases propagate
  # automatically via `release: published` now that release.yml uses
  # PACKAGES_TOKEN. Pass the tag (vX.Y.Z) you want to build + push.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to check out (tag or branch). Empty = default branch.'
        required: false
        default: ''

# Least privilege at workflow level.
permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    # ~3x the observed 10-11min. The linux/arm64 leg runs under QEMU, which is
    # where a hang would show up; without a bound it would sit for 6h.
    timeout-minutes: 35
    # release / workflow_dispatch: build AND push to GHCR.
    # Pull requests and pushes to main: build only (smoke-test the Dockerfile
    # without bumping :latest off every commit — :latest tracks the most
    # recent release, not the most recent code change).
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # Skip auto-sync commits
    if: "!startsWith(github.event.head_commit.message, 'auto:')"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Log in to GHCR
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        # PACKAGES_TOKEN is a classic PAT owned by the project lead with
        # write:packages scope. It authorizes publication to the Corbet Labs
        # package namespace independently of the repository workflow token.
        # The same secret is used by homebrew.yml.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: julian-corbet
          password: ${{ secrets.PACKAGES_TOKEN }}

      - name: Resolve version from ref
        id: version
        # Normalises the ref (release tag, workflow_dispatch input, or
        # plain push) into VERSION + MAJOR_MINOR outputs we feed into
        # the Docker tags below. Done as a separate step (instead of
        # letting metadata-action's type=semver compute the tags) so
        # the workflow_dispatch path also produces proper version tags
        # — type=semver only inspects github.ref, which stays at
        # refs/heads/main on a manual dispatch even if `inputs.ref` is
        # a tag, so the semver patterns previously emitted nothing.
        run: |
          REF="${{ github.event.inputs.ref || github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            VERSION="${REF#refs/tags/v}"
          elif [[ "$REF" == v* ]]; then
            VERSION="${REF#v}"
          else
            VERSION=""
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if [[ -n "$VERSION" ]]; then
            echo "major_minor=${VERSION%.*}" >> $GITHUB_OUTPUT
          fi
          # Build-args still need a VERSION even for the dev path.
          echo "VERSION=${VERSION:-dev}" >> $GITHUB_ENV
          echo "COMMIT=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/corbet-labs/dotkeeper
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ steps.version.outputs.major_minor != '' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest pushed image
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/corbet-labs/dotkeeper
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
