name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday at 06:00 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Observed ~40s; Scorecard's own API calls are the only slow part.
    timeout-minutes: 15
    permissions:
      # SARIF upload to Code Scanning
      security-events: write
      # OIDC for scorecard publish_results
      id-token: write
      # codeql-action/upload-sarif reads workflow-run metadata
      actions: read
      # Checkout the repo
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the public OpenSSF results API so the
          # api.securityscorecards.dev badge / dashboard light up.
          publish_results: true

      # Upload SARIF to GitHub Code Scanning (free on public repos).
      # Results appear under the repo's Security tab.
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v3
        with:
          sarif_file: results.sarif
